<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiesverkehr</title>

    <meta
        name="description"
        content="Kiesverkehr - Handmade Cycling Bags."
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kiesverkehr">
    <meta property="og:description" content="Handmade Cycling Bags.">
    <meta property="og:url" content="https://kiesverkehr.de">
    <meta property="og:site_name" content="Kiesverkehr">

    <meta property="og:image" content="https://kiesverkehr.de/share-logo-v2.jpg">
    <meta property="og:image:secure_url" content="https://kiesverkehr.de/share-logo-v2.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Kiesverkehr Logo">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Kiesverkehr Favicon -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="256x256">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=2">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #ffffff;
            color: #171717;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;

            padding: 40px 24px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        .brand {
            width: 100%;
            line-height: 0;
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
        }

        @media (max-height: 500px) {
            .container {
                max-width: min(650px, 110vh);
                padding: 16px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <h1 class="brand">
            <img
                src="/logo.png?v=2"
                alt="Kiesverkehr"
                class="logo"
                width="3616"
                height="2738"
            >
        </h1>

    </main>

</body>

</html>
