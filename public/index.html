<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiesverkehr</title>

    <meta
        name="description"
        content="Kiesverkehr - Handmade Cycling Bags. Coming Soon."
    >

    <!-- Kiesverkehr Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #faf9f6;
            color: #171717;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;

            padding: 40px 24px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        /* =========================
           OAK TREE LOGO
        ========================= */

        .logo {
            display: block;

            width: clamp(190px, 42vw, 320px);
            height: auto;

            margin-bottom: -15px;
        }

        /* =========================
           BRAND NAME IMAGE
        ========================= */

        .brand {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-image {
            display: block;

            width: 100%;
            max-width: 550px;
            height: auto;

            object-fit: contain;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .container {
                padding: 24px 16px;
            }

            .logo {
                width: clamp(180px, 58vw, 240px);
                margin-bottom: -10px;
            }

            .brand-image {
                width: 100%;
                max-width: 92vw;
            }

        }

        /* =========================
           SMALL SCREENS
        ========================= */

        @media (max-height: 500px) {

            .container {
                padding: 16px;
            }

            .logo {
                width: 150px;
                margin-bottom: -8px;
            }

            .brand-image {
                max-width: 320px;
            }

        }

    </style>
</head>

<body>

    <main class="container">

        <!-- Oak tree logo -->
        <img
            src="/logo.png"
            alt="Windgepeitschte Eiche am Wasser"
            class="logo"
        >

        <!-- Vintage Kiesverkehr lettering -->
        <h1 class="brand">
            <img
                src="/schriftzug.png"
                alt="Kiesverkehr"
                class="brand-image"
            >
        </h1>

    </main>

</body>

</html>
